services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: gnm_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-narratives}
      POSTGRES_USER: ${POSTGRES_USER:-narratives}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-narratives}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
      - ./docker/postgres/tables:/docker-entrypoint-initdb.d/tables:ro

  airflow:
    build:
      context: .
      dockerfile: docker/airflow/Dockerfile
    image: gnm-airflow:local
    container_name: gnm_airflow
    restart: unless-stopped
    depends_on:
      - postgres
    env_file:
      - .env
    environment:
      AIRFLOW_HOME: /opt/airflow
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://${POSTGRES_USER:-narratives}:${POSTGRES_PASSWORD:-narratives}@postgres:5432/${POSTGRES_DB:-narratives}
      AIRFLOW__CORE__DAGS_FOLDER: /opt/airflow/dags
      PYTHONPATH: /opt/airflow/project
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
    ports:
      - "127.0.0.1:${AIRFLOW_PORT:-8080}:8080"
    networks:
      - default
      - debug_net
    volumes:
      - ./dags:/opt/airflow/dags
      - ./src:/opt/airflow/project/src
      - ./data:/opt/airflow/project/data
      - airflow_logs:/opt/airflow/logs
    command: airflow standalone

  jupyter:
    build:
      context: .
      dockerfile: docker/jupyter/Dockerfile
    image: gnm-jupyter:local
    container_name: gnm_jupyter
    restart: unless-stopped
    depends_on:
      - postgres
    env_file:
      - .env
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
    ports:
      - "127.0.0.1:${JUPYTER_PORT:-8888}:8888"
    volumes:
      - ./:/workspace
    working_dir: /workspace
    command: jupyter lab --ip=0.0.0.0 --port=8888 --no-browser --allow-root --NotebookApp.token=''

  superset-init:
    image: apache/superset:4.0.2
    container_name: gnm_superset_init
    depends_on:
      - postgres
    env_file:
      - .env
    environment:
      SUPERSET_SECRET_KEY: ${SUPERSET_SECRET_KEY}
      SUPERSET_CONFIG_PATH: /app/pythonpath/superset_config.py
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
    volumes:
      - superset_home:/app/superset_home
      - ./superset_config.py:/app/pythonpath/superset_config.py:ro
    command: >
      /bin/sh -c "
      superset db upgrade &&
      superset fab create-admin
        --username ${SUPERSET_ADMIN_USERNAME}
        --firstname ${SUPERSET_ADMIN_FIRSTNAME}
        --lastname ${SUPERSET_ADMIN_LASTNAME}
        --email ${SUPERSET_ADMIN_EMAIL}
        --password ${SUPERSET_ADMIN_PASSWORD} || true &&
      superset init
      "

  superset:
    image: apache/superset:4.0.2
    container_name: gnm_superset
    restart: unless-stopped
    depends_on:
      - superset-init
      - postgres
    env_file:
      - .env
    environment:
      SUPERSET_CONFIG_PATH: /app/pythonpath/superset_config.py
      SUPERSET_SECRET_KEY: ${SUPERSET_SECRET_KEY}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
    ports:
      - "127.0.0.1:${SUPERSET_PORT:-8088}:8088"
    networks:
      - default
      - debug_net
    volumes:
      - superset_home:/app/superset_home
      - ./superset_config.py:/app/pythonpath/superset_config.py:ro
    command: >
      /bin/sh -c "superset run -h 0.0.0.0 -p 8088"

  debug:
    build:
      context: ./docker/debug
      dockerfile: Dockerfile
    image: gnm-debug:local
    container_name: gnm_debug
    restart: unless-stopped
    depends_on:
      - airflow
      - superset
    networks:
      - debug_net
      - debug_ssh
    read_only: true
    tmpfs:
      - /tmp:mode=1777
      - /run:mode=755
      - /var/log
      - /home/debugger:uid=50000,gid=50000,mode=700
    ports:
      - "127.0.0.1:${DEBUG_SSH_PORT:-2222}:22"
    volumes:
      - ${HOME}/.config/market_narratives_engine/debug/authorized_keys:/run/secrets/authorized_keys:ro
      - airflow_logs:/opt/airflow/logs:ro

volumes:
  postgres_data:
  superset_home:
  airflow_logs:

networks:
  debug_net:
    internal: true
  debug_ssh:
